  - name: område
    logicalType: object
    physicalType: geometry(MultiSurface)
    required: true
    customProperties:
    - property: geometryType
      value: MultiSurface
  - name: posisjon
    logicalType: object
    physicalType: geometry(Point)
    required: true
    customProperties:
    - property: geometryType
      value: Point
  - name: land
    logicalType: string
    logicalTypeOptions:
      pattern: ^(BouvetIsland|Denmark|FaroeIslands|Finland|Greenland|Iceland|Norway|RussianFederation|SvalbardAndJanMayen|Sweden|UnitedKingdom)$
    customProperties:
    - property: allowedValues
      value:
      - value: BouvetIsland
        label: Landkode for Boyvetøya
      - value: Denmark
        label: Landkode for Danmark
      - value: FaroeIslands
        label: Landkode for Færøyene
      - value: Finland
        label: Landkode for Finland
      - value: Greenland
        label: Landkode for Grønland
      - value: Iceland
        label: Landkode for Island
      - value: Norway
        label: Landkode for Norge
      - value: RussianFederation
        label: Landkode for Russland
      - value: SvalbardAndJanMayen
        label: Landkode for Svalbard og Jan Mayen
      - value: Sweden
        label: Landkode for Sverige
      - value: UnitedKingdom
        label: Landkode for Storbritania
    description: 'stat som den administrative enheten hører til


      Merknad: Alfanumerisk kode (ISO 3166-1 alpha-2) for land som definert i ISO
      3166'
  - name: administrativKode
    logicalType: string
    description: 'tematisk identifikator som tilsvarer kode for den nasjonale administrative
      inndelingen


      Merknad: I Norge skal alltid fire sifre benyttes. For eksempel Ringerike kommune:
      3007; Viken fylke: 3000; Norge: 0000'
  - name: samiskForvaltningsområde
    logicalType: boolean
    description: angir om fylket er en del ac samisk forvaltningaområde
  - name: fylkesnummer
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/inndelinger/inndelingsbase/fylkesnummer?
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Fylkesnummer
    description: 'nummerering av fylker i henhold til Statistisk sentralbyrå sin offisielle
      liste


      Merknad:

      Det presiseres at fylkesnummer alltid skal ha 2 sifre, dvs. eventuelt med ledende
      null. Fylkesnummer benyttes for kopling mot en rekke andre registre som også
      benytter 2 sifre.'
    required: true
