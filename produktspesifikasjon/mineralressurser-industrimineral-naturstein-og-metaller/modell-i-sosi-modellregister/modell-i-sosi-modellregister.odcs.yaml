          INSPIRE Description:

          Geologic provinces classified by mineral resources.'
      - value: distrikt
        label: 'geologisk distrikt, karakteristisk for ulike mineralforekomster


          INSPIRE Description:

          Geologic districts classified by mineral resources.'
      - value: felt
        label: 'region eller område karakteristisk for ulike mineralforekomster. Eks
