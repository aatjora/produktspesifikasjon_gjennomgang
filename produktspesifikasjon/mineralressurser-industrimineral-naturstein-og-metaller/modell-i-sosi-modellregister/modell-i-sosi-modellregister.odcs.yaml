      - value: malmsone
        label: 'mineralforekomst som har form som årer eller ganger i hovedbergarten


          INSPIRE Description:

          A mineral deposit consisting of a zone of veins, veinlets, disseminations,
          or planar breccias.'
      - value: prosjekt
        label: prosjekt
    description: 'hvilken type mineralforekomst dette er i en økonomisk betraktning


