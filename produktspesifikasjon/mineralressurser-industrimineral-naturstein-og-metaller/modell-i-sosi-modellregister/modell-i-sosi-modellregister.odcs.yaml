          3.  Forekomster av byggeråstoffer med verdi eller potensial for eksport
          på minst 1 millioner tonn årlig'
      - value: Nasjonal betydning
        label: '1.  Mineralforekomster som har et bekreftet eller sannsynlig, betydelig
          fremtidig verdiskapingspotensial

          <i>- herunder forekomster med betydelig in-situ verdi</i>

          <i>- herunder byggeråstoffer med betydelig potensial for eksport</i>


          2.  Mineralforekomster som har unike kvaliteter som gjør dem særlig egnet
          til foredlende industri

          <i>- herunder industrimineraler og spesialmetaller av særlig høy kvalitet</i>


          3.  Mineralforekomster som har unike kvaliteter som byggeråstoff

          <i>- herunder pukk- og grusforekomster med unike fysiske egenskaper </i>

          <i>- herunder natursteinsforekomster med unike egenskaper og attraktivitet
          i det internasjonale markedet</i>

          <i>- herunder forekomster av metaller og industrimineraler som har dokumentert
          eller sannsynlig framtidig betydning som råstoff til andre viktige samfunnsområder</i>


          4.  Forekomster av strategisk viktige eller ”kritiske” råstoff

          <i>- herunder forekomster av metaller og industrimineraler som har dokumentert
          eller sannsynlig framtidig betydning som råstoff til viktige norske samfunnsområder</i>


          5.  Forekomster som er særdeles viktig for Norges nasjonale infrastruktur

          <i>- herunder grus- og pukkforekomster som er særlig viktig for forsyninger
          til større befolkningssentra i Norge</i>'
      - value: Regional betydning
        label: '1.  Mineralforekomster som har et bekreftet eller sannsynlig fremtidig
          verdiskapingspotensial med in situ-verdi på mellom 100 og 1000 millioner
          kroner


          2.  Mineralforekomster som er særdeles viktig for regional infrastruktur

          <i>- herunder industrimineral-, naturstein-, grus- og pukkforekomster som
          er særlig viktig for forsyninger innen en region</i>

          <i>- herunder natursteinsforekomster som har eller har hatt særlig betydning
