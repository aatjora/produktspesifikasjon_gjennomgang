  - name: rastoffBetydning
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Internasjonal\ betydning|Nasjonal\ betydning|Regional\ betydning|Lokal\
        betydning|Liten\ lokal\ betydning|Ikke\ vurdert)$
    customProperties:
    - property: allowedValues
      value:
      - value: Internasjonal betydning
        label: '1.  Metall- og industrimineralforekomster med dokumenterte ressurser
          som kan gi et signifikant bidrag til internasjonale behov

          <i>- herunder forekomster med meget høy dokumentert in situ-verdi basert
          på kvalitet og tonnasje</i>

          <i>- herunder forekomster med potensial for årsproduksjon som dekker signifikant
          andel av behov i EU/EØS</i>


          2.  Forekomster av strategisk viktige eller ”kritiske” råstoff

          <i>- herunder dokumenterte forekomster av mineraler på EU liste over kritiske
          råstoffer som utnyttes eller har potensial for framtidig utnyttelse</i>


          3.  Forekomster av byggeråstoffer med verdi eller potensial for eksport
          på minst 1 millioner tonn årlig

          <i>

          </i>'
      - value: Nasjonal betydning
        label: '1.  Mineralforekomster som har et bekreftet eller sannsynlig, betydelig
          fremtidig verdiskapingspotensial

          <i>- herunder forekomster med betydelig in-situ verdi</i>

          <i>- herunder byggeråstoffer med betydelig potensial for eksport</i>


          2.  Mineralforekomster som har unike kvaliteter som gjør dem særlig egnet
          til foredlende industri

          <i>- herunder industrimineraler og spesialmetaller av særlig høy kvalitet</i>


          3.  Mineralforekomster som har unike kvaliteter som byggeråstoff

          <i>- herunder pukk- og grusforekomster med unike fysiske egenskaper </i>

          <i>- herunder natursteinsforekomster med unike egenskaper og attraktivitet
          i det internasjonale markedet</i>

          <i>- herunder forekomster av metaller og industrimineraler som har dokumentert
          eller sannsynlig framtidig betydning som råstoff til andre viktige samfunnsområder</i>


          4.  Forekomster av strategisk viktige eller ”kritiske” råstoff

          <i>- herunder forekomster av metaller og industrimineraler som har dokumentert
          eller sannsynlig framtidig betydning som råstoff til viktige norske samfunnsområder</i>


          5.  Forekomster som er særdeles viktig for Norges nasjonale infrastruktur

          <i>- herunder grus- og pukkforekomster som er særlig viktig for forsyninger
          til større befolkningssentra i Norge</i>'
      - value: Regional betydning
        label: '1.  Mineralforekomster som har et bekreftet eller sannsynlig fremtidig
          verdiskapingspotensial med in situ-verdi på mellom 100 og 1000 millioner
          kroner


          2.  Mineralforekomster som er særdeles viktig for regional infrastruktur

          <i>- herunder industrimineral-, naturstein-, grus- og pukkforekomster som
          er særlig viktig for forsyninger innen en region</i>

          <i>- herunder natursteinsforekomster som har eller har hatt særlig betydning
          for byggeskikk og arkitektur i en region</i>'
      - value: Lokal betydning
        label: '1.  Mineralforekomster som er viktig for lokal infrastruktur

          <i>- herunder industrimineral-, naturstein-, grus- og pukkforekomster som
          er viktig for forsyninger innen en kommune</i>'
      - value: Liten lokal betydning
        label: Forekomsten  har liten eller ingen økonomisk betydning
      - value: Ikke vurdert
        label: Forekomstens økonomiske betydning er ikke vurdert
    description: hvorvidt forekomsten er av internasjonal, nasjonal, regional, eller
      kun av lokal betydning (viktighet)
    required: true
  - name: mineralRegistreringType
    logicalType: string
    logicalTypeOptions:
      pattern: ^(forekomst|registrering|prospekt|provins|distrikt|felt|malmsone|prosjekt)$
    customProperties:
    - property: allowedValues
      value:
      - value: forekomst
        label: 'en mineralkonsentrasjon i jordskorpen, en anrikning eller en akkumulasjon.
          Kan brukes om alle typer mineralforekomster.

          INSPIRE Description:

          A mass of naturally occurring mineral material, e.g. metal ores or non-metallic
          minerals, usually of economic value, without regard to mode of origin. Accumulations
          of coal and petroleum may or may not be included.'
      - value: registrering
        label: 'en økonomisk interessant malm- eller mineralanrikning

          Any ore or economic mineral in any concentration found in bedrock or as
