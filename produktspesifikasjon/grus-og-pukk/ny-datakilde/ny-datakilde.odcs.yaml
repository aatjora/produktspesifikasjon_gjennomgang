    customProperties:
    - property: allowedValues
      value:
      - value: Morenemateriale, uspesifisert
        label: Materiale plukket opp, transportert og avsatt av isbreer. Det er vanligvis,
          dårlig sortert og kan inneholde alt fra leir til stein og blokk. Mektighet,
          morenetype og overflateform kan variere. Benyttes ved kartframstilling i
          svært små målestokker.
      - value: Morenemateriale, sammenhengende dekke, stedvis med stor mektighet
        label: Materiale plukket opp, transportert og avsatt av isbreer, vanligvis
          hardt sammenpakket, dårlig sortert og kan inneholde alt fra leir til stein
          og blokk. Moreneavsetninger med tykkelse fra 0,5 m til flere ti-talls meter.
          Det er få eller ingen fjellblotninger i området.
      - value: Morenemateriale, usammenhengende eller tynt dekke over berggrunnen
        label: Materiale plukket opp, transportert og avsatt av isbreer. Det er vanligvis
          hardt sammenpakket, dårlig sortert og kan inneholde alt fra leir til stein
          og blokk. Områder med grunnlendte moreneavsetninger/hyppige fjellblotninger.
          Tykkelsen på avsetningene er normalt mindre enn 0,5 m, men den kan helt
          lokalt være noe mer.
      - value: Moreneleire
        label: Morenemateriale med særlig høyt leir- og siltinnhold, oftest meget
          kompakt.
      - value: Avsmeltningsmorene (Ablasjonsmorene)
        label: Hauger og rygger med løst lagret, delvis vannbehandlet og noe sortert
          morenemateriale avsatt fra stagnerende breer (dødis). Terrenget er preget
          av haug- og ryggformer med vekslende orientering.
      - value: Randmorene/randmorenebelte
        label: Rygger eller belter av morenemateriale som er skjøvet opp foran brefronten.
          Materialet er usortert og inneholder alle kornstørrelser fra leir til blokk.
          Noen steder kan morenematerialet finnes i veksling med breelvmateriale.
      - value: Drumlin
        label: Langstrakt, rettlinjet morenerygg dannet langs isbevegelsesretningen
          i bunnen av en bre. Ofte stor tykkelse, avrundet form og lengden kan være
          opp til noen km.
      - value: Rogenmorene
        label: Rygger av morenemateriale, orientert på tvers av brebevegelsen.
      - value: Breelvavsetning (Glasifluvial avsetning)
        label: Materiale transportert og avsatt av breelver. Sedimentet består av
          sorterte, ofte skråstilte lag av forskjellig kornstørrelse fra fin sand
          til stein og blokk. Breelvavsetninger har ofte klare overflateformer som
          terrasser, rygger og vifter. Mektigheten er ofte flere ti-talls meter.
      - value: Breelv- og elveavsetning
        label: Materiale transportert og avsatt av elver eller breelver. Sedimentet
          består av sorterte lag av forskjellig kornstørrelse fra fin sand til grus
          og stein. Det er ikke skilt mellom breelv- og elveavsetninger. Brukes kun
          i spesielle tilfeller.
      - value: Ryggformet breelvavsetning (Esker)
        label: Sortert og lagdelt materiale, vesentlig sand og grus, avsatt i tunneler
          eller sprekker i breen. Der avsetningen er stor nok til å danne figur på
          kartet brukes fargen for breelvavsetninger til å angi utbredelsen og eskersymbolet
          til å angi ryggformen.
      - value: Haugformet breelvavsetning (Kame)
        label: Materiale avsatt av smeltevann i hulrom i breen. Store avsetninger
          gis fargen for breelvavsetninger i kombinasjon med symbol for kame.
      - value: Bresjø-/eller brekammeravsetning (Glasilakustrin avsetning)
        label: Finkornig materiale avsatt i bresjø eller vannfylt brekammer hvor tykkelsen
          er mer enn 0,5 m og arealdekningen er stor nok til å danne figur på kartet.
          Mektigheten kan være flere ti-talls meter.
      - value: Breelv- og bresjø-/brekammeravsetning (Glasifluvial og glasilakustrin
          avsetning)
        label: Materiale avsatt av breelv eller i bredemte sjøer/brekammer. Det er
          ikke skilt mellom breelv- og bresjø-/kammeravsetninger.
      - value: Innsjøavsetning (Lakustrin avsetning)
        label: Materiale avsatt i innsjøer hvor tykkelsen er mer enn 0,5 m.
      - value: Bresjø-/brekammer og innsjøavsetning (Glasilakustrin og lakustrin avsetning)
        label: Benyttes hvis en ønsker å slå sammen de to avsetningstypene. I tilfelle
          brukes ikke separate farger for bresjø og innsjø på det samme kartbladet.
      - value: Strandavsetning, innsjø og/eller bresjø
        label: Strandvaskede sedimenter med mektighet større enn 0,5 m, dannet ved
          bølgeaktivitet i ferskvann. Materialet er ofte rundet og godt sortert. Kornstørrelsen
          varierer, men sand og grus er vanligst.
      - value: Hav- og fjordavsetning, uspesifisert
        label: Benyttes ved kartframstilling i svært små målestokker der en ikke skiller
          etter mektighet.
      - value: Hav- og fjordavsetning, sammenhengende dekke, ofte med stor mektighet
        label: Finkornige, marine avsetninger med mektighet fra 0,5 m til flere ti-tall
          meter. Avsetningstypen omfatter også skredmasser fra kvikkleireskred, ofte
          angitt med tilleggssymbol. Det er få eller ingen fjellblotninger i området.
      - value: Marin strandavsetning, sammenhengende dekke
        label: Marine strandvaskede sedimenter med mektighet større enn 0,5 m, dannet
          av bølge- og strømaktivitet i strandsonen, stedvis som strandvoller. Materialet
          er ofte rundet og godt sortert. Kornstørrelsen varierer fra sand til blokk,
          men sand og grus er vanligst. Strandavsetninger ligger som et forholdsvis
          tynt dekke over berggrunn eller andre sedimenter.
      - value: Hav- og fjordavsetning  og strandavsetning, usammenhengende eller tynt
          dekke over berggrunnen
        label: Grunnlendte områder/hyppige fjellblotninger. Tykkelsen på avsetningene
          er normalt mindre enn 0,5 m, men den kan helt lokalt være noe større. Det
          er ikke skilt mellom hav-, fjord- og strandavsetning. Kornstørrelser angis
          normalt ikke, men kan være alt fra leir til blokk.
      - value: Skjellsand
        label: Avsetning som i stor grad består av knuste skall av kalkutskillende
          organismer. Er en type av bioklastisk materiale. Kornstørrelse varierer
          fra nesten hele skall til sand. Det kan være ansamlet store mengder av skjellsand
          i umiddelbar nærhet av gode skjellvekstområder.
      - value: Marin gytje
        label: Avsetning som består av finkornig materiale, silt og leir med høyt
          organisk innhold. Det organiske materialet er primærprodusert i vannmassene.
          Marin gytje finnes i områder hvor det er liten materialtransport fra land.
          Brukes sjelden.
      - value: Elve- og bekkeavsetning (Fluvial avsetning)
        label: Materiale som er transportert og avsatt av elver og bekker. De mest
          typiske formene er elvesletter, terrasser og vifter. Sand og grus dominerer,
          og materialet er sortert og rundet. Mektigheten varierer fra 0,5 til mer
          enn 10 m.
      - value: Elveavsetning, sammenhengende dekke
        label: Materiale som er transportert og avsatt av elver og bekker. De mest
          typiske formene er elvesletter, terrasser og vifter. Sand og grus dominerer,
          og materialet er sortert og rundet. Brukes kun i spesielle tilfeller.
      - value: Elveavsetning, usammenhengende/tynt dekke
        label: Grunnlendte områder med elveavsetninger. Brukes kun i spesielle tilfeller.
      - value: Flomavsetning (uspesifisert)
        label: Brukes for spesielle sedimenter avsatt ved plutselig uttapning av bresjøer.
      - value: Flomavsetning, sammenhengende
        label: Brukes for spesielle sedimenter avsatt ved plutselig uttapning av bresjøer.
      - value: Flomavsetning, usammenhengende/tynt
        label: Brukes for spesielle sedimenter avsatt ved plutselig uttapning av bresjøer.
          Tykkelse mindre enn 0,5 m.
      - value: Vindavsetning (Eolisk avsetning)
        label: Flygesand med tykkelse mer enn 0,5 m.
      - value: Forvitringsmateriale, ikke inndelt etter mektighet
        label: Løsmasser dannet på stedet ved fysisk eller kjemisk nedbryting av berggrunnen.
          Gradvis overgang til underliggende fast fjell. Brukes når en ikke skiller
          mellom sammenhengende og usammenhengende dekke av denne avsetningstypen.
      - value: Forvitringsmateriale, sammenhengende dekke
        label: Løsmasser dannet på stedet ved fysisk eller kjemisk nedbryting av berggrunnen.
          Tykkelsen er mer enn 0,5 m.
      - value: Forvitringsmateriale, usammenhengende eller tynt dekke over berggrunnen
        label: Løsmasser dannet på stedet ved fysisk eller kjemisk nedbryting av berggrunnen.
          Grunnlendt område med tallrike fjellblotninger.
      - value: Forvitringsmateriale, stein- og blokkrikt, dannet ved frostsprengning
        label: Blokkhav, oftest i fjellområder.
      - value: Skredmateriale, ikke inndelt etter mektighet
        label: Avsetninger dannet ved steinsprang, fjellskred, snø- eller løsmasseskred
          fra bratte dalsider. Uspesifisert tykkelse.
      - value: Skredmateriale, sammenhengende dekke, stedvis med stor mektighet
        label: Avsetninger dannet ved steinsprang, fjellskred, snøskred eller løsmasseskred
          fra bratte dalsider. Symbol viser dominerende skredtype. Tykkelsen er mer
          enn 0,5 m og det er få fjellblotninger i området.
      - value: Skredmateriale, usammenhengende eller tynt dekke over berggrunnen
        label: Grunnlendte områder med avsetninger fra steinsprang, fjellskred, snø-
          og løsmasseskred fra bratte dalsider. Symbol viser dominerende skredtype.
          Tykkelse mindre enn 0,5 m.
      - value: Steinbreavsetning
        label: Steinur som inneholder/har inneholdt is og derfor er i bevegelse/har
          vært i bevegelse som en vanlig bre. Avsetningstypen dannes under permafrostforhold.
      - value: Torv og myr (Organisk materiale)
        label: Organisk jord dannet av døde planterester, med mektigheter større enn
          0,5 m. Det skilles ikke mellom ulike torvtyper.
      - value: Humusdekke/tynt torvdekke over berggrunn
        label: Områder hvor humusdekket ligger rett på berggrunnen. Mektigheten av
          humusdekket er vanligvis 0,2 - 0,5 m, men kan lokalt være tykkere. Fjellblotninger
          opptrer hyppig innen slike områder. Fjellblotninger opptrer hyppig innen
          slike områder.
      - value: Usammenhengende eller tynt løsmassedekke over berggrunnen, flere løsmassetyper,
          uspesifisert
        label: Forskjellige sedimenter som danner et tynt eller usammenhengende dekke
          over berggrunnen. Denne betegnelsen brukes bare i spesielle tilfeller når
          en ikke velger å skille mellom ulike typer av løsmasser.
      - value: Sammenhengende løsmassedekke av flere jordarter
        label: Vanligvis skredmateriale med morenemateriale, forvitringsmateriale,
          torv og humus sterkt blanda ved skråningsprosesser. Brukes kun i spesielle
          tilfeller der det er meget vanskelig å skille mellom opprinnelige løsmassetyper.
      - value: Bart fjell/fjell med tynt torvdekke, uspesifisert
        label: Brukes når en ikke velger å skille mellom bart fjell og humusdekke
          eller tynt torvdekke over berggrunnen.
      - value: Fyllmasse (antropogent materiale)
        label: Løsmasser tilført eller sterkt påvirket av menneskers aktivitet, vesentlig
          i urbane områder.
      - value: Steintipp
        label: Tilførte steinmasser.
      - value: Menneskepåvirket materiale, ikke nærmere spesifisert
        label: Dominerende stedegne masser, omarbeidet i overflaten.
      - value: Bart fjell
        label: Brukes om områder som stort sett mangler løsmasser, mer enn 50 % av
          arealet er fjell i dagen.
      - value: Bart fjell/fjell med usammenhengende eller  tynt løsmassedekke
        label: Brukes på oversiktskart der bart fjell slås sammen med alle typer tynt
          eller usammenhengende løsmassedekke.
      - value: Marin suspensjonsavsetning
        label: Finkornige (leire, silt) sedimenter transportert og avsatt fra suspensjon.
          Draperer vanligvis underliggende sedimenter eller fjell og er oftest lagdelt.
      - value: Marin bunnstrømavsetning
        label: Sedimenter som består av sand og grus transportert og avsatt fra bunnstrømmer.
          Dekker bunnen av undersjøiske kanaler laget av bunnstrømmer. Har ofte kryss-sjiktet
          og lentikulær- sjiktet indre struktur.
      - value: Glasimarin avsetning
        label: Hovedsakelig finkornige suspensjonsavsetninger (silt, leire) avsatt
          i nærhet av is/isbreer. Kan være påvirket av bunnstrømmer og utjevner topografien
          mer enn draperer. Forekommer i mektige lag i områder på kontinentalhyllen
          langs kysten og i fjorder
      - value: Iskontaktavsetning
        label: Sedimenter avsatt i kontakt med is. Kan være morene, glasifluvialt
          materiale, eller en blanding av glasialt avsatte sedimenter. Kornstørrelsen
          veksler mellom leire og grus alt etter hvilke prosesser som virket.
      - value: Utvaskingslag
        label: Sedimenter bestående av sand, grus og bergartsfragmenter etter at finstoffet
          er vasket vekk av bølger og strøm. Danner et dekkende lag over morene eller
          andre jordarter med stor variasjon i kornstørrelser.
      - value: Glasifluvial deltaavsetning (marin)
        label: Sedimenter transportert av breelver og avsatt i hav, bresjø eller innsjø.
      - value: Fluvial deltaavsetning
        label: Sedimenter avsatt ved utløpet av en elv i en fjord, innsjø eller i
          havet. Kornstørrelsen er ofte i sandfraksjonen nær elveutløpet og mer finkornig
          på dypere vann. Har typisk skrålaging med helling i strømretningen.
      - value: Tidevannsavsetning
        label: Avsetning dannet i kystnære områder ved tidevannstransport. Sedimentene
          er sandige til leirholdige med typiske strukturer som sanddyner, rifler,
          kryss-sjikting, mikro-kryss-sjikting, flasersjikting og lentikulær sjikting.
      - value: Estuarin avsetning
        label: Et sediment avsatt i brakkvann i et estuarie. Sedimentet er karakterisert
          av finkornig materiale (silt, leire) av marin og fluvial opprinnelse blandet
          med en høy andel rester av terrestrisk organisk materiale.
      - value: Levé avsetning (marin)
        label: Avsetning dannet som en forhøyning av sedimenter langs en eller begge
          sidene  av en undersjøisk kanal (kløft, viftedal eller dyphavskanal). Avsetningen
          kan ha varierende kornstørrelse, fra finkornig (leir) til nokså grovt materiale
          (sand).
      - value: Grunnmarin avsetning
        label: Sedimenter avsatt i turbulent grunt marint miljø der det fineste materialet
          er vasket ut og transportert til dypere vann av strømmer og bølger. Består
          av sand, grus og stein. I områder med mye sand kan sandbølger bygges med
          en karakteristisk kryss-sjikting og skrålaging.
      - value: Konturittavsetning
        label: Klastiske sedimenter transportert og avsatt av kontur-strømmer langs
          egga kanten. Består av fint, velsortert materiale (silt og leir). Avsetningene
          har vanligvis horisontal- eller kryss-sjiktning og normal- eller omvendt
          gradering.
      - value: Turbitittavsetning
        label: Avsetninger dannet ved sedimenttransport og utfelling fra en turbidittstrøm.  Består
          av materiale i kornstørrelse fra leire til sand og er ofte karakterisert
          ved normalgradert lagning og moderat til dårlig sortering. Finnes oftest
          ved foten av skråninger med stor mektighet av løse sedimenter (for eksempel
          langs kontinentalskråningen).
      - value: Debrisstrømavsetning
        label: Avsetning fra en flytende masse av stein, jord og slam. Den består
          av usortert materiale der mer enn halvparten av partiklene er større enn
          sandstørrelse.
      - value: Undersjøisk vifteavsetning
        label: En konisk eller vifteformet avsetning beliggende ved munningen av en
          undersjøisk kløft. Består for det meste av fine sedimenter (leire, silt).
          Viften har en finlaget indre struktur med en svak helling av lagene mot
          dyphavet.
      - value: Kanalsavsetning
        label: Sedimenter avsatt i en kanal. Avsetningene vil vanligvis bestå av relativt
          grove sedimenter (sand, grus)
      - value: Dypmarin avsetning
        label: Samlebetegnelse på dyphavssedimenter. Kan være både konturittisk, hemipelagisk,
          eupelagisk osv. Dette er fine sedimenter bunnfelt utenfor kontinentalmarginen.
          Består i stor grad av leire og rester av pelagiske organismer.
      - value: Bioklastisk avsetning
        label: Sediment som for en stor del består av små partikler av biologisk opprinnelse
          (skjell, korall). Kornstørrelsen kan variere fra sand til hele skjell eller
          korallkolonier. Forekommer i begrensete områder der vekstforholdene har
          vært optimale over lengre tid og mengden av annet klastisk materiale liten.
      - value: Vulkanosedimentær avsetning
        label: Avsetning som består av materiale av vulkansk opprinnelse. Alt etter
          kornstørrelse kan sedimentene deles inn i vulkansk aske, lapilli (2-64 mm)
          og breksje (>64mm).
      - value: Lagdelte sedimenter (>1 m) over debrisstrøm
        label: Lagdelte sedimenter (>1m) over debrisstrømavsetning.
      - value: Skredmateriale, dekket av yngre sedimenter
        label: Skredmateriale, dekket av yngre sedimenter
      - value: Skredmateriale, delvis dekket av yngre sedimenter
        label: Skredmateriale, delvis dekket av yngre sedimenter
      - value: Skredmateriale og hemipelagiske avsetninger
        label: Veksling mellom skredavsetninger og hemipelagiske avsetninger. Hemipelagiske
          avsetninger består stort sett av finkornet materiale, delvis produsert i
          vannmassene lokalt, og delvis tilført utenifra.
      - value: Uspesifisert marin avsetning
        label: Marin avsetning med ukjent opprinnelse.
      - value: Jordskredavsetning, sammenhengende dekke, stedvis med stor mektighet
        label: Avsetning som dannes når løsmasser i bratt terreng løsner og raser
          nedover. Danner ofte karakteristiske vifte- eller tungelignende former.
      - value: Jordskredavsetning, usammenhengende eller tynt dekke
        label: Grunnlendt avsetning som dannes når løsmasser i bratt terreng løsner
          og raser nedover.
      - value: Leirskredavsetning, sammenhengende dekke, stedvis med stor mektighet
        label: Avsetning som dannes når leirholdige sedimenter løsner og glir ut.
      - value: Leirskredavsetning, usammenhengende eller tynt dekke over berggrunnen
        label: Avsetning som dannes når leirholdige sedimenter løsner og glir ut.
      - value: Fjellskredavsetning, sammenhengende dekke, stedvis med stor mektighet
        label: Dannes når store fjellparti løsner og med kolossal kraft går ned i
          daler og fjorder. Består mest av kantete blokker.
      - value: Fjellskredavsetning, usammenhengende eller tynt dekke
        label: Grunnlendte områder med fjellskredmateriale.
      - value: Steinsprangavsetning, sammenhengende dekke, stedvis med stor mektighet
        label: Materiale som har løsnet fra fast fjell og over tid akkumulert som
          bratte urer ved foten av skråninger. Materialet varierer fra sand til blokk,
          med økende kornstørrelse nedover skråningen.
      - value: Steinsprangavsetning, usammenhengende eller tynt dekke
        label: Grunnlendte områder med steinsprangmateriale.
      - value: Snøskredavsetning, sammenhengende dekke, stedvis med stor mektighet
        label: Dannes i områder med gjentatte snøskred og har ofte vifteform.
      - value: Snøskredavsetning, usammenhengende eller tynt dekke
        label: Grunnlendte områder med snøskredmateriale.
      - value: Fjellskred-/steinsprangavsetning, sammenhengende dekke, stedvis med
          stor mektighet
        label: Materiale bestående av steinblokker fra større fjellparti som har løsnet
          og rast ned. Består hovedsakelig av usortert grovt materiale (stein og blokk)
          og finnes oftest ved foten av skrenter/fjellsider.
      - value: Fjellskred-/steinsprangavsetning, usammenhengende eller tynt dekke
        label: Grunnlendte områder med fjellskred-/steinsprangmateriale.
      - value: Snø- og jordskredavsetning, sammenhengende dekke
        label: Dannes i områder med vekslende snø- og jordskred.
      - value: Snø- og jordskredavsetning, usammenhengende eller tynt dekke
        label: Grunnlendte områder med snøskredmateriale og jordskredmateriale.
      - value: Jordskred- og steinsprangavsetning, sammenhengende dekke
        label: Dannes i bratt terreng der både jordskred og steinsprang forekommer.
      - value: Jordskred- og steinsprangavsetning, usammenhengende eller tynt dekke
        label: Grunnlendte områder med jordskred- og steinsprangmateriale.
      - value: Finkornig organiskholdig sigejord
        label: Sterkt frostpåvirket blandingsmateriale som beveger seg sakte nedover
          slake skråninger, dannet fra en eller flere opprinnelig finstoffholdige
          løsmassetyper.
      - value: Steinrikt sigende skråningsmateriale
        label: Grovkornig frostpåvirket blandingsmateriale som beveger seg sakte nedover
          skråninger, dannet fra forvitret fjell, skråningsmateriale eller morenemateriale.
