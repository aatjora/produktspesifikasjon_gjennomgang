          An  area  that  is  a  potential  site  of  mineral  deposits,  based  on  preliminary
          exploration, previous exploration. A geologic or geophysical anomaly, especially
          one recommended for additional exploration.'
      - value: provins
        label: 'geologisk provins - stort område som er enhetlig med hensyn til opptreden
          av ulike metaller eller mineraler. Er en områdeavgrensning rundt en eller
          flere større eller mindre registreringer og/eller observasjoner med potensial
