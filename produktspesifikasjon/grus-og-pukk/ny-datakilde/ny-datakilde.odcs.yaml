# Open Data Contract Standard (ODCS) v3.1.0 — generert fra datamodellen.
apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:grus-og-pukk-ny-datakilde:1.0.0
version: 1.0.0
status: active
name: Grus og pukk - Ny datakilde
schema:
- name: GeolAvgrLinje
  physicalName: geolavgrlinje
  logicalType: object
  physicalType: table
  description: 'generell avgrensning av geologisk objekt



    -- Definition --

    general delimitation of geological object'
  customProperties:
  - property: sosiObjektType
    value: GeolAvgrLinje
  properties:
  - name: grense
    logicalType: string
    description: 'forløp som følger overgang mellom ulike fenomener


      -- Definition --

      course follwing the transition between different real world phenomena'
    required: true
- name: PukkUttak
  physicalName: pukkuttak
  logicalType: object
  physicalType: table
  description: lokalitet hvor pukk tas ut (steinbrudd)
  customProperties:
  - property: sosiObjektType
    value: PukkUttak
  - property: inheritsFrom
    value: FelleskomponenterGrusPukk
  - property: associations
    value:
    - role: grusPukkObservasjonOgUttakAvgrensning
      target: GeolAvgrLinje
      cardinality: 1..*
    - role: tilhører
      target: PukkOmr
      cardinality: 0..1
  properties:
  - name: datauttaksdato
    logicalType: timestamp
    description: 'dato for uttak fra en database


      Merknad:

      Skiller seg fra Kopidato ved at en ikke skiller på om det er uttak fra en originaldatabase
      eller en kopidatabase.'
  - name: kvalitet
    logicalType: object
    properties:
    - name: målemetode
      logicalType: string
      logicalTypeOptions:
        pattern: ^(Terrengmålt:\ Uspesifisert\ måleinstrument|Terrengmålt:\ Totalstasjon|Terrengmålt:\
          Teodolitt\ og\ el\ avstandsmåler|Terrengmålt:\ Teodolitt\ og\ målebånd|Terrengmålt:\
          Ortogonalmetoden|Utmål|Tatt\ fra\ plan|Annet\ \ \(denne\ har\ ingen\ mening,\
          bør\ fjernes\?\)|Stereoinstrument|Aerotriangulert|Stereoinstrument:\ Analytisk\
          plotter|Stereoinstrument:\ Autograf|Stereoinstrument:\ Digitalt|Scannet\
          fra\ kart|Skannet\ fra\ kart:\ Blyantoriginal|Skannet\ fra\ kart:\ Rissefolie|Skannet\
          fra\ kart:\ Transparent\ folie,\ god\ kvalitet|Skannet\ fra\ kart:\ Transparent\
          folie,\ mindre\ god\ kvalitet|Skannet\ fra\ kart:\ Papirkopi|Flybåren\ laserscanner|Bilbåren\
          laser|Lineær\ referanse|Digitaliseringbord:\ Ortofoto\ eller\ flybilde|Digitaliseringbord:\
          Ortofoto,\ film|Digitaliseringbord:\ Ortofoto,\ fotokopi|Digitaliseringbord:\
          Flybilde,\ film|Digitaliseringbord:\ Flybilde,\ fotokopi|Digitalisert\ på\
          skjerm\ fra\ ortofoto|Digitalisert\ på\ skjerm\ fra\ satellittbilde|Digitalisert\
          på\ skjerm\ fra\ andre\ digitale\ rasterdata|Digitalisert\ på\ skjerm\ fra\
          tolkning\ av\ seismikk|Vektorisering\ av\ laserdata|Digitaliseringsbord:\
          Kart|Digitaliseringsbord:\ Kart,\ blyantoriginal|Digitaliseringsbord:\ Kart,\
          rissefoile|Digitaliseringsbord:\ Kart,\ transparent\ foile,\ god\ kvalitet|Digitaliseringsbord:\
          Kart,\ transparent\ foile,\ mindre\ god\ kvalitet|Digitaliseringsbord:\
          Kart,\ papirkopi|Digitalisert\ på\ skjerm\ fra\ skannet\ kart|Genererte\
          data\ \(interpolasjon\)|Genererte\ data\ \(interpolasjon\):\ Terrengmodell|Genererte\
          data\ \(interpolasjon\):\ Vektet\ middel|Genererte\ data:\ Fra\ annen\ geometri|Genererte\
          data:\ Generalisering|Genererte\ data:\ Sentralpunkt|Genererte\ data:\ Sammenknytningspunkt,\
          randpunkt|Koordinater\ hentet\ fra\ GAB|Koordinater\ hentet\ fra\ JREG|Beregnet|Spesielle\
          metoder|Spesielle\ metoder:\ Målt\ med\ stikkstang|Spesielle\ metoder:\
          Målt\ med\ waterstang|Spesielle\ metoder:\ Målt\ med\ målehjul|Spesielle\
          metoder:\ Målt\ med\ stigningsmåler|Fastsatt\ punkt|Fastsatt\ ved\ dom\
          eller\ kongelig\ resolusjon|Annet\ \(spesifiseres\ i\ filhode\)\ \(\ bør\
          vel\ fjernes,\ blir\ borte\ ved\ overføring\ mellom\ systemer\)|Frihåndstegning|Frihåndstegning\
          på\ kart|Frihåndstegning\ på\ skjerm|Treghetsstedfesting|GNSS:\ Kodemåling,\
          relative\ målinger|GNSS:\ Kodemåling,\ enkle\ målinger|GNSS:\ Fasemåling,\
          statisk\ måling|GNSS:\ Fasemåling,\ andre\ metoder|Kombinasjon\ av\ GNSS/Treghet|GNSS:\
          Fasemåling\ RTK|GNSS:\ Fasemåling\ ,\ float\-løsning|Ukjent\ målemetode)$
      customProperties:
      - property: allowedValues
        value:
        - value: 'Terrengmålt: Uspesifisert måleinstrument'
          label: Målt i terrenget , uspesifisert metode/måleinstrument
        - value: 'Terrengmålt: Totalstasjon'
          label: Målt i terrenget med totalstasjon
        - value: 'Terrengmålt: Teodolitt og el avstandsmåler'
          label: Målt i terrenget med teodolitt og elektronisk avstandsmåler
        - value: 'Terrengmålt: Teodolitt og målebånd'
          label: Målt i terrenget med teodolitt og målebånd
        - value: 'Terrengmålt: Ortogonalmetoden'
          label: Målt i terrenget, ortogonalmetoden
        - value: Utmål
          label: 'Punkt beregnet på bakgrunn av måling mot andre punkter, slik som
            to avstander eller avstand og retning


            -- Definition --

            Point calculated on the basis of other items, such as two distances or
            distance + direction.'
        - value: Tatt fra plan
          label: Tatt fra plan eller godkjent tiltak
        - value: Annet  (denne har ingen mening, bør fjernes?)
          label: Annet
        - value: Stereoinstrument
          label: Målt i stereoinstrument, uspesifisert instrument
        - value: Aerotriangulert
          label: 'Punkt beregnet ved aerotriangulering


            -- Definition --

            Point calculated by aerotriangulation'
        - value: 'Stereoinstrument: Analytisk plotter'
          label: Målt i stereoinstrument, analytisk plotter
        - value: 'Stereoinstrument: Autograf'
          label: Målt i stereoinstrument, autograf, analogt instrument
        - value: 'Stereoinstrument: Digitalt'
          label: Målt i stereoinstrument, digitalt instrument
        - value: Scannet fra kart
          label: Geometri overført fra kart maskinelt ved hjelp av skanner, uspesifisert
            kartmedium
        - value: 'Skannet fra kart: Blyantoriginal'
          label: Geometri overført fra kart maskinelt ved hjelp av skanner. Kartmedium
            er blyantoriginal
        - value: 'Skannet fra kart: Rissefolie'
          label: Geometri overført fra kart maskinelt ved hjelp av skanner. Kartmedium
            er rissefolie
        - value: 'Skannet fra kart: Transparent folie, god kvalitet'
          label: Geometri overført fra kart maskinelt ved hjelp av skanner. Kartmedium
