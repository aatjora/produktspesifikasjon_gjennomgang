    - name: nøyaktighet
      logicalType: integer
      description: 'punktstandardavviket i grunnriss for punkter samt tverravvik for
        linjer


        Merknad:

        Oppgitt i cm'
    description: 'beskrivelse av kvaliteten på stedfestingen


      Merknad: Denne er identisk med ..KVALITET i tidligere versjoner av SOSI.'
  - name: identRastoffobj
    logicalType: integer
    description: 'forekomstobjektets identifikasjonskode


      Merknad: Består av kommunenummer (4 siffer), og et løpenummer (7 siffer). Ideelt
      sett består løpenummeret av et område nummer (3 siffer), lokalitetsnummer (2
      siffer) og prøvenummer (2 siffer).


      Eksempel: 17290010101'
    required: true
  - name: forekomstNummer
    logicalType: integer
    description: 'unik nummerering av forekomsten som råstoffobjektet tilhører


      Merknad: Benyttes som koplingsnøkkel mellom de ulike objektene i forekomsten.
      Mange viktige egenskaper finnes kun på områdeobjektet som er hovedobjektet til
      forekomsten


      Eks. 1729001'
    required: true
